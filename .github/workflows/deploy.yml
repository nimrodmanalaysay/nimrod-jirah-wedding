# ============================================================
# GitHub Actions — Auto Deploy to GitHub Pages
#
# This runs automatically every time you push to the `main`
# branch. It builds the React app and publishes it to the
# `gh-pages` branch, which GitHub Pages serves.
#
# You do NOT need to run this manually — just push your code.
# ============================================================

name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main   # Triggers on every push to main

# Allow the workflow to write to the repo (needed for gh-pages)
permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Check out the code
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Set up Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # 3. Install dependencies
      - name: Install dependencies
        run: npm install

      # 4. Build the production bundle
      - name: Build
        run: npm run build

      # 5. Deploy the /dist folder to the gh-pages branch
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
